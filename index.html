<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSPCI 스포츠심리검사</title>
    <meta name="description" content="TOPS2, CSAI-2 등 스포츠심리검사를 온라인으로 실시하고 결과를 확인하세요." />

    <!-- 카카오톡 등 메신저 링크 공유 시 미리보기용 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KSPCI 스포츠심리검사" />
    <meta property="og:description" content="TOPS2, CSAI-2 등 스포츠심리검사를 온라인으로 실시하고 결과를 확인하세요." />
    <meta property="og:url" content="https://mental-check-blue.vercel.app/" />
    <meta property="og:image" content="https://mental-check-blue.vercel.app/kspci-share.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json" /> <meta name="theme-color" content="#F6F7F9" /> <link rel="apple-touch-icon" href="/icons/icon-192.png" /> <meta name="apple-mobile-web-app-capable" content="yes" />

    <style>
      /* 잉크 + 화이트 기본기, 블루 강조 — 절제된 모서리와 옅은 그림자 (다크모드 없음) */
      :root {
        --paper: #F6F7F9;
        --paperDim: #EDEFF3;
        --card: #FFFFFF;
        --ink: #101725;
        --inkDim: #5B6577;
        --accent: #2F62F0;
        --accent2: #12875A;
        --warn: #C9503F;
        --line: #E7EAEF;
        /* color-mix()는 html2canvas(결과 이미지 저장)가 못 읽어서, 미리 계산된 rgba로 대신 정의 */
        --accent-tint: rgba(47, 98, 240, 0.08);
        --accent2-tint: rgba(18, 135, 90, 0.12);
        --warn-tint: rgba(201, 80, 63, 0.1);
        --inkDim-tint: rgba(91, 101, 119, 0.1);
        --warn-soft-bg: rgba(201, 80, 63, 0.06);
        --warn-soft-border: rgba(201, 80, 63, 0.25);
      }
      html, body, #root { min-height: 100%; }
      html { background: var(--paper); }
      body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif !important;
        background: var(--paper);
        letter-spacing: -0.01em;
      }
      /* 표제는 별도 서체 없이 Pretendard 두께·자간만으로 위계를 만든다 */
      .font-headline {
        font-weight: 800 !important;
        letter-spacing: -0.03em !important;
      }
      /* 문항번호·원점수 등 데이터는 자릿수가 흔들리지 않게 */
      .font-mono {
        font-family: 'Pretendard', ui-monospace, sans-serif !important;
        font-variant-numeric: tabular-nums;
      }
      /* 그림자를 없애는 대신 아주 옅게 — 카드가 살짝 떠 보이는 정도만 */
      .shadow-sm, .shadow-md, .shadow-lg {
        box-shadow: 0 1px 2px rgba(16, 23, 37, 0.04) !important;
      }
      /* 모서리는 완전히 각지지도, 알약형도 아닌 절제된 라운드로 */
      .rounded, .rounded-lg, .rounded-xl, .rounded-2xl, .rounded-t-2xl, .rounded-full {
        border-radius: 10px !important;
      }
      input, textarea, select {
        --tw-ring-color: rgba(47, 98, 240, 0.35);
      }
    </style>
  </head>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));}
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
