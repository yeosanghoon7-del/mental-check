<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSPCI 스포츠심리검사</title>
    <meta name="description" content="TOPS2, CSAI-2 등 스포츠심리검사를 온라인으로 실시하고 결과를 확인하세요." />

    <!-- 카카오톡 등 메신저 링크 공유 시 미리보기용 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KSPCI 스포츠심리검사" />
    <meta property="og:description" content="TOPS2, CSAI-2 등 스포츠심리검사를 온라인으로 실시하고 결과를 확인하세요." />
    <meta property="og:url" content="https://mental-check-blue.vercel.app/" />
    <meta property="og:image" content="https://mental-check-blue.vercel.app/kspci-share.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Noto+Serif+KR:wght@500;600;700;900&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json" /> <meta name="theme-color" content="#F5F4F0" /> <link rel="apple-touch-icon" href="/icons/icon-192.png" /> <meta name="apple-mobile-web-app-capable" content="yes" />

    <style>
      /* 데이터-에디토리얼: 논문·저널 톤의 크림/잉크 팔레트 (다크모드 없음) */
      :root {
        --paper: #F5F4F0;
        --paperDim: #EDEBE3;
        --card: #FFFFFF;
        --ink: #1C1E1B;
        --inkDim: #63665F;
        --accent: #9C7A2E;
        --accent2: #33553A;
        --warn: #8C3B2E;
        --line: #D9D7CE;
        /* color-mix()는 html2canvas(결과 이미지 저장)가 못 읽어서, 미리 계산된 rgba로 대신 정의 */
        --accent-tint: rgba(156, 122, 46, 0.15);
        --accent2-tint: rgba(51, 85, 58, 0.15);
        --warn-tint: rgba(140, 59, 46, 0.15);
        --inkDim-tint: rgba(99, 102, 95, 0.15);
        --warn-soft-bg: rgba(140, 59, 46, 0.08);
        --warn-soft-border: rgba(140, 59, 46, 0.3);
      }
      html, body, #root { min-height: 100%; }
      html { background: var(--paper); }
      body {
        font-family: 'Source Sans 3', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif !important;
        background: var(--paper);
      }
      /* 표제용 세리프 — 라틴 문자는 Fraunces, 한글은 Noto Serif KR로 저널 느낌을 맞춘다 */
      .font-headline {
        font-family: 'Fraunces', 'Noto Serif KR', 'Pretendard', serif !important;
      }
      /* 문항번호·원점수 등 실제 데이터만 모노스페이스로 */
      .font-mono {
        font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace !important;
      }
      /* 카드+그림자 대신 헤어라인 룰로 구획을 나누므로 그림자는 모두 제거 */
      .shadow-sm, .shadow-md, .shadow-lg {
        box-shadow: none !important;
      }
      /* 라운드 최소화 — 완전한 원(rounded-full)도 저널 그리드에 맞춰 각지게 */
      .rounded, .rounded-lg, .rounded-xl, .rounded-2xl, .rounded-t-2xl, .rounded-full {
        border-radius: 2px !important;
      }
      /* 입력창 포커스 링을 Tailwind 기본 파란색 대신 브라스 톤으로 */
      input, textarea, select {
        --tw-ring-color: rgba(156, 122, 46, 0.45);
      }
    </style>
  </head>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));}
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
